<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Sender</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-2xl space-y-6">
      <h1 class="text-3xl font-bold text-gray-800 text-center">Send Email</h1>

      <form method="POST" action="/send" class="space-y-6">
        <div>
          <label class="block text-sm font-semibold text-gray-700"
            >Recipient Email</label
          >
          <input
            name="recipient"
            required
            class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blue-200"
            type="email"
            value="{{.Recipient}}"
          />
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700"
            >Subject</label
          >
          <input
            name="subject"
            required
            class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blue-200"
            type="text"
            value="{{.Subject}}"
          />
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700">Body</label>
          <textarea
            id="body"
            name="body"
            rows="6"
            class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blue-200"
            value="{{.Body}}"
          ></textarea>
        </div>

        <!-- Template Section -->
        <div class="border-t pt-6">
          <h2 class="text-lg font-semibold text-gray-800 mb-3">Templates</h2>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Template 1 -->
            <div class="p-4 border rounded-xl bg-gray-50 shadow-sm">
              <p class="font-medium text-gray-700 mb-2">Friendly Greeting</p>
              <button
                type="button"
                class="text-sm bg-blue-600 text-white px-3 py-1 rounded hover:bg-blue-700"
                onclick="
							document.getElementById('body').value += 
							'\nHello,\n\nThank you for reaching out.\nLet me know if you need anything else.\n\nBest regards,\n';
						"
              >
                Insert
              </button>
            </div>

            <!-- Template 2 -->
            <div class="p-4 border rounded-xl bg-gray-50 shadow-sm">
              <p class="font-medium text-gray-700 mb-2">Information Response</p>
              <button
                type="button"
                class="text-sm bg-blue-600 text-white px-3 py-1 rounded hover:bg-blue-700"
                onclick="
							document.getElementById('body').value += 
							'\nHi there,\n\nHere is the information you requested.\nFeel free to ask if you need more.\n\nCheers,\n';
						"
              >
                Insert
              </button>
            </div>

            <!-- Template 3 -->
            <div class="p-4 border rounded-xl bg-gray-50 shadow-sm">
              <p class="font-medium text-gray-700 mb-2">Follow-Up</p>
              <button
                type="button"
                class="text-sm bg-blue-600 text-white px-3 py-1 rounded hover:bg-blue-700"
                onclick="
							document.getElementById('body').value += 
							'\nHello,\n\nJust following up on my previous message. Let me know when you have a moment.\n\nThanks,\n';
						"
              >
                Insert
              </button>
            </div>

            <!-- Template 4 -->
            <div class="p-4 border rounded-xl bg-gray-50 shadow-sm">
              <p class="font-medium text-gray-700 mb-2">Formal Business</p>
              <button
                type="button"
                class="text-sm bg-blue-600 text-white px-3 py-1 rounded hover:bg-blue-700"
                onclick="
							document.getElementById('body').value += 
							'\nDear Sir or Madam,\n\nI am writing to follow up regarding our previous correspondence. Please advise on the next steps.\n\nSincerely,\n';
						"
              >
                Insert
              </button>
            </div>
          </div>
        </div>

        <button
          class="w-full bg-blue-600 text-white py-3 rounded-xl text-lg font-semibold hover:bg-blue-700"
        >
          Send Email
        </button>
      </form>

      <p class="text-center text-sm text-gray-500 pt-4">
        <a
          href="https://github.com/khaled-0/MiscArchive/tree/main/MailClient"
          target="_blank"
          class="underline hover:text-gray-700"
        >
          View Source on GitHub
        </a>
      </p>
    </div>

    <!-- Message / Error Dialog -->
    <dialog id="msgDialog" class="rounded-xl shadow-xl p-0 w-80">
      <!-- Header turns red for error, green for success -->
      <div
        id="msgHeader"
        class="px-4 py-3 rounded-t-xl font-semibold
		       {{if .Error}} bg-red-600 text-white 
		       {{else if .Message}} bg-green-600 text-white 
		       {{end}}"
      >
        {{if .Error}} Error {{else if .Message}} Success {{end}}
      </div>

      <div class="p-4 bg-white text-gray-800">
        <p id="msgText">
          {{if .Error}}{{.Error}}{{else if .Message}}{{.Message}}{{end}}
        </p>
      </div>

      <div class="p-3 bg-gray-100 flex justify-end rounded-b-xl">
        <button
          onclick="msgDialog.close()"
          class="px-4 py-1 bg-gray-300 rounded hover:bg-gray-400"
        >
          Close
        </button>
      </div>
    </dialog>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // Open dialog only if there is an error or a success message
        const hasError = "{{.Error}}" !== "";
        const hasMsg = "{{.Message}}" !== "";
        if (hasError || hasMsg) {
          document.getElementById("msgDialog").showModal();
        }
      });
    </script>
  </body>
</html>
